<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

<script>

/* =========================================
   FIXED GALLERY COLUMNS
========================================= */

const gallery = document.querySelector(".full-gallery");

const galleryItems = Array.from(
    gallery.querySelectorAll(":scope > .full-gallery-item")
);

function getGalleryLayout() {

    if (window.innerWidth > 768 && window.innerWidth <= 1000) {
        return "tablet";
    }

    return "three-columns";
}


function renderGalleryColumns() {

    const layout = getGalleryLayout();

    let groups;

    if (layout === "tablet") {

        groups = [
            galleryItems.slice(0, 33),
            galleryItems.slice(33)
        ];

    } else {

        groups = [
            galleryItems.slice(0, 20),
            galleryItems.slice(20, 40),
            galleryItems.slice(40, 65)
        ];

    }

    gallery.replaceChildren();

    groups.forEach(function (items) {

        const column = document.createElement("div");

        column.className = "full-gallery-column";

        items.forEach(function (item) {
            column.appendChild(item);
        });

        gallery.appendChild(column);

    });

}


let currentLayout = getGalleryLayout();

renderGalleryColumns();


window.addEventListener("resize", function () {

    const newLayout = getGalleryLayout();

    if (newLayout === currentLayout) return;

    currentLayout = newLayout;

    renderGalleryColumns();

});


/* =========================================
   GLIGHTBOX
========================================= */

const lightbox = GLightbox({

    selector: ".glightbox",

    touchNavigation: true,

    loop: true,

    zoomable: true,

    openEffect: "zoom",

    closeEffect: "fade"

});


/* =========================================
   AOS
========================================= */

AOS.init({

    duration: 1200,

    once: true,

    easing: "ease-out-cubic",

    offset: 100

});


/* =========================================
   LAZY LOAD PORTFOLIO IMAGES
========================================= */

const lazyImages = document.querySelectorAll(
    ".full-gallery-item img[data-src]"
);

const imageQueue = [];
const queuedImages = new Set();

let activeLoads = 0;

const maxConcurrentLoads = 2;


function getImagePriority(image) {

    const rect = image.getBoundingClientRect();

    if (rect.bottom < 0) {
        return 100000 + Math.abs(rect.bottom);
    }

    if (rect.top < window.innerHeight) {
        return Math.max(0, rect.top);
    }

    return rect.top;
}


function addToQueue(image) {

    if (queuedImages.has(image)) return;

    if (image.dataset.loaded === "true") return;

    queuedImages.add(image);

    imageQueue.push(image);

    processQueue();

}


function processQueue() {

    imageQueue.sort(function (a, b) {

        return getImagePriority(a) - getImagePriority(b);

    });


    while (
        activeLoads < maxConcurrentLoads &&
        imageQueue.length > 0
    ) {

        const image = imageQueue.shift();

        activeLoads++;

        let finished = false;


        function finishLoading() {

            if (finished) return;

            finished = true;

            activeLoads--;

            if (image.naturalWidth > 0) {

                image.classList.add("loaded");

                image.dataset.loaded = "true";

            }

            processQueue();

        }


        image.addEventListener(
            "load",
            finishLoading,
            { once: true }
        );

        image.addEventListener(
            "error",
            finishLoading,
            { once: true }
        );


        image.src = image.dataset.src;


        if (image.complete) {
            finishLoading();
        }

    }

}


const imageObserver = new IntersectionObserver(

    function (entries, observer) {

        entries.forEach(function (entry) {

            if (!entry.isIntersecting) return;

            const image = entry.target;

            observer.unobserve(image);

            addToQueue(image);

        });

    },

    {
        rootMargin: "100px 0px"
    }

);


lazyImages.forEach(function (image) {

    imageObserver.observe(image);

});

</script>
